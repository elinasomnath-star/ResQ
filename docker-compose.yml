services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data/processed:/app/data/processed
    environment:
      PYTHONPATH: /app/src
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/events', timeout=5)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
    restart: unless-stopped
